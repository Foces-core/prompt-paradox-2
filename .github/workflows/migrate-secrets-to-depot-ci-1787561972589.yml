name: Import secrets and variables to Depot CI
on:
  push:
    branches:
      - 'depot-migrate-secrets-**'

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import secrets
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add CONVEX_DEPLOY_KEY="$CONVEX_DEPLOY_KEY" NEXT_PUBLIC_TURNSTILE_SITE_KEY="$NEXT_PUBLIC_TURNSTILE_SITE_KEY" --repo Foces-core/prompt-paradox-2
  variables:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import variables
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          unset DEPOT_TOKEN
          depot ci vars add NEXT_PUBLIC_CONVEX_URL="$NEXT_PUBLIC_CONVEX_URL" --repo Foces-core/prompt-paradox-2
  cleanup:
    needs: [secrets, variables]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_branch_pattern='^depot-migrate-secrets-[0123456789bcdfghjklmnpqrstvwxz]{10}$'
          if [[ ! "$GITHUB_REF_NAME" =~ $expected_branch_pattern ]]; then
            echo "Refusing to delete unexpected branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
